    <circle cx="555" cy="58" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin="0s" repeatCount="indefinite"/></circle><circle cx="603" cy="106" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin=".45s" repeatCount="indefinite"/></circle><circle cx="651" cy="154" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin=".9s" repeatCount="indefinite"/></circle><circle cx="699" cy="202" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin="1.35s" repeatCount="indefinite"/></circle><circle cx="747" cy="154" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin="1.8s" repeatCount="indefinite"/></circle><circle cx="795" cy="106" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin="2.25s" repeatCount="indefinite"/></circle><circle cx="843" cy="58" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin="2.7s" repeatCount="indefinite"/></circle><circle cx="795" cy="202" r="9"><animate attributeName="opacity" values=".12;1;.12" dur="5.6s" begin="3.15s" repeatCount="indefinite"/></circle>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-label="Animated robot building a field of green contribution nodes">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#101b28"/></linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="microgrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1b2a3a" stroke-width="1" opacity=".45"/></pattern>
  </defs>
  <rect width="960" height="250" rx="18" fill="url(#background)"/>
  <rect width="960" height="250" rx="18" fill="url(#microgrid)"/>
  <g stroke="#263e55" stroke-width="2" fill="none" opacity=".9"><path d="M82 70H170L205 104H280"/><path d="M82 190H165L205 155H280"/><path d="M458 125H508"/><path d="M855 42V25H908"/><path d="M855 208V225H908"/></g>

    <circle cx="555" cy="106" r="9"/><circle cx="603" cy="106" r="9"/><circle cx="651" cy="106" r="9"/><circle cx="699" cy="106" r="9"/><circle cx="747" cy="106" r="9"/><circle cx="795" cy="106" r="9"/><circle cx="843" cy="106" r="9"/>
    <circle cx="555" cy="154" r="9"/><circle cx="603" cy="154" r="9"/><circle cx="651" cy="154" r="9"/><circle cx="699" cy="154" r="9"/><circle cx="747" cy="154" r="9"/><circle cx="795" cy="154" r="9"/><circle cx="843" cy="154" r="9"/>
    <circle cx="555" cy="202" r="9"/><circle cx="603" cy="202" r="9"/><circle cx="651" cy="202" r="9"/><circle cx="699" cy="202" r="9"/><circle cx="747" cy="202" r="9"/><circle cx="795" cy="202" r="9"/><circle cx="843" cy="202" r="9"/>
